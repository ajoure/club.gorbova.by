# grant-access-for-order accepts both signed-in admin JWTs and service-to-service
# secret keys. Supabase's gateway verify_jwt only accepts JWT-shaped keys and
# rejects the newer sb_secret_* keys before the function can authenticate them.
# The function therefore owns authentication: caller_auth.ts verifies a user JWT
# through Auth or compares the exact managed service key, then applies a strict
# per-branch authorization matrix before any order read/write.
[functions.grant-access-for-order]
verify_jwt = false

# Privileged GetCourse writers own authentication in-function so both current
# non-JWT service keys and signed-in operators can be authorized with RBAC.
[functions.getcourse-grant-access]
