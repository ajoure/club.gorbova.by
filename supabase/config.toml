# grant-access-for-order accepts both signed-in admin JWTs and service-to-service
# secret keys. Supabase's gateway verify_jwt only accepts JWT-shaped keys and
# rejects the newer sb_secret_* keys before the function can authenticate them.
# The function therefore owns authentication: caller_auth.ts verifies a user JWT
# through Auth or compares the exact managed service key, then applies a strict
# per-branch authorization matrix before any order read/write.
[functions.grant-access-for-order]
verify_jwt = false

# Service-to-service composable fulfillment uses the same exact managed
# `apikey` authentication as grant-access-for-order. New sb_secret_* keys are
# not JWTs, so the handler owns the exact-key check.
[functions.finalize-composable-purchase]
verify_jwt = false

# Historical acquiring recovery is an admin-only mutation. The platform JWT
# wall is backed by an in-function has_role_v2(admin|super_admin) check.
[functions.admin-backfill-2026-orders]
verify_jwt = true

# Admin-only read model for service-role notification_outbox. The function
# validates the caller with has_role_v2 before returning reminder statuses.
[functions.admin-auto-renewal-observability]
verify_jwt = true

# One-off storage migration: platform JWT plus in-function admin/super_admin
# guard and an explicit confirmation phrase before any source object is removed.
[functions.admin-migrate-student-submissions]
verify_jwt = true

