verify_jwt = false

# Telegram access functions accept either an authenticated administrator or the
# exact managed service key in `apikey`/Bearer. Gateway JWT verification would
# reject the current `sb_secret_*` key before this stricter in-function policy
# can run.
[functions.telegram-grant-access]
verify_jwt = false

[functions.telegram-revoke-access]
verify_jwt = false

# Expiry cleanup is an internal job only. Its handler accepts the exact managed
