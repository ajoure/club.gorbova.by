name: Club paid lesson corrections
on:
  pull_request:
    paths:
      - 'supabase/migrations/*_club_paid_lesson_corrections.sql'
      - 'scripts/club-paid-lessons/**'
      - '.github/workflows/club-paid-lesson-corrections.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*_club_paid_lesson_corrections.sql'
      - 'scripts/club-paid-lessons/**'
      - '.github/workflows/club-paid-lesson-corrections.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    name: Exact paid lesson PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: club-fixture-only
          POSTGRES_DB: club_paid_lesson_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d club_paid_lesson_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: club-fixture-only
      PGDATABASE: club_paid_lesson_test
      CLUB_PAID_LESSON_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/club-paid-lessons/test_contract.py
