name: Release quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-and-contracts:
    name: Code, contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      referral-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: referral-test-only
          POSTGRES_DB: referral_redemption_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      # The repository has a pre-existing global ESLint backlog.  Do not turn
      # this release gate into a false-red check for unrelated legacy files:
      # lint the new executable test surface, then run the complete contract
      # suite and production build below.
      - name: Lint release-gate code
        run: npx eslint e2e/release-safety-gate.spec.ts
      - name: Verify Edge Function references
        run: npm run verify:edge-functions
      - name: Unit and integration contracts
        run: npx vitest run
      - name: Sales knowledge and dialogue contracts (offline)
        # The AAC regression uses a real decoder, never a mocked PCM buffer.
        # Install explicitly: GitHub's Ubuntu runner does not bundle ffmpeg.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          node --test scripts/sales-knowledge/*.test.mjs
      - name: Referral redemption money and access contracts
        run: node scripts/referrals/redemption-database.test.mjs
      - name: Referral wallet real PostgreSQL concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: referral-test-only
          PGDATABASE: referral_redemption_test
          REFERRAL_SQL_FIXTURE_PATH: /tmp/referral-redemption-fixture.sql
        run: |
          node scripts/referrals/redemption-database.test.mjs
          node scripts/referrals/redemption-concurrency.test.mjs
      - name: CB21 learning release RLS boundaries
        run: |
          node scripts/tests/cb21-learning-release.test.mjs
          node scripts/tests/cb21-oct31-schedule.test.mjs
      - name: Site questionnaire atomicity and real PostgreSQL concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: referral-test-only
          PGDATABASE: site_questionnaire_test
          SITE_QUESTIONNAIRE_SQL_FIXTURE_PATH: /tmp/site-questionnaire-fixture.sql
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE site_questionnaire_test'
          node --test scripts/tests/site-questionnaire-database.test.mjs
          node scripts/tests/site-questionnaire-concurrency.test.mjs
      - name: Accounting regulations migration safety
        run: node --test scripts/tests/accounting-regulations-migration.test.mjs
      - name: Instagram monitor queue, budget and RLS
        run: node scripts/tests/instagram-monitor-db.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instagram monitor Edge types and media guards
        run: |
          deno check --no-lock supabase/functions/instagram-monitor/index.ts supabase/functions/instagram-monitor-worker/index.ts
          deno test --no-lock supabase/functions/_shared/instagram-monitor_test.ts supabase/functions/_shared/instagram-apify_test.ts supabase/functions/instagram-monitor/release-health_test.ts supabase/functions/instagram-monitor-worker/provider_test.ts
      - name: Site questionnaire Edge types
        run: deno check --no-lock supabase/functions/site-form-submit/index.ts
      - name: MNS current-law Edge types
        run: node scripts/verify-mns-function-bundles.mjs
      - name: Browser application types
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Production build
        run: npm run build

  safe-production-smoke:
    name: Opt-in test-only checkout smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      E2E_RUN_SAFE_RELEASE: "true"
      E2E_ALLOW_PRODUCTION_TEST_DATA: "true"
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_TEST_PRODUCT_ID: ${{ secrets.E2E_TEST_PRODUCT_ID }}
      E2E_TEST_TARIFF_CODE: ${{ secrets.E2E_TEST_TARIFF_CODE }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Assert required runner secrets
        run: |
          set -euo pipefail
          for name in E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_TEST_PRODUCT_ID VITE_SUPABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing protected GitHub secret $name"
              exit 1
            fi
          done
      - name: Safe test-only order and access proof
        run: npx playwright test e2e/release-safety-gate.spec.ts --project=chromium
