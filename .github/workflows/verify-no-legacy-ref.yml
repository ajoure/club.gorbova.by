name: Verify no legacy Supabase project_ref

# Guard for Infrastructure Cleanup.
# Single canonical Supabase project_ref = hdjgkjceownmmnrqqtuz.
# Production remains on Lovable until separately verified cutover.
# The reviewed rollback-only migration runner may pin the independent target.
# All other non-documentation mentions remain forbidden.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert legacy ref absent (excluding documentation)
        run: |
          set -euo pipefail
          LEGACY='ypwsuumurrtkxatoyqhk'
          # Allowed mentions: documentation/proof/plan/memory and this guard itself.
          # Forbidden: code, configs, workflows (except this one), migrations, scripts, env.
          MATCHES=$(grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.vite-cache-v2 \
            --exclude-dir=.vite-cache-v3 \
            --exclude-dir=.vite-cache-v4 \
            --exclude-dir=.vite-cache-v5 \
            --exclude-dir=.lovable \
            --exclude-dir=docs \
            --exclude='*.md' \
            --exclude='verify-no-legacy-ref.yml' \
            --exclude-dir=copy-private-storage-bridge \
            -- "$LEGACY" . || true)
          # Only the exact target pin in the operator's rollback-only tool is allowed.
          # This does not permit target references in runtime, configuration or other lines.
          MATCHES=$(printf '%s\n' "$MATCHES" | python3 -c '
          import re, sys
          allowed = r"^\./scripts/auth_restore_dryrun\.py:\d+:TARGET = " + re.escape(repr(sys.argv[1])) + r"$"
          print("\n".join(line for line in sys.stdin.read().splitlines() if line and not re.fullmatch(allowed, line)))
          ' "$LEGACY")
          if [ -n "$MATCHES" ]; then
            echo "::error::Legacy Supabase project_ref '$LEGACY' detected in code/config. Canonical ref is 'hdjgkjceownmmnrqqtuz'."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no legacy ref found in code/config."


      - name: Assert canonical ref present in config.toml
        run: |
          set -euo pipefail
          if ! grep -q 'project_id = "hdjgkjceownmmnrqqtuz"' supabase/config.toml; then
            echo "::error::supabase/config.toml does not pin canonical project_id."
            exit 1
          fi
          echo "OK: canonical project_id pinned."
