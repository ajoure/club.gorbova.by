name: Migration rehearsal safety

on:
  pull_request:
    paths:
      - 'scripts/*restore*.py'
      - 'scripts/migration_disk_guard.py'
      - 'scripts/auth_restore_requirements.txt'
      - '.github/workflows/migration-rehearsal-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/auth_restore_requirements.txt
      - name: SQL execution and disk budget boundaries (no database or secrets)
        run: python -m unittest discover -s scripts -p test_full_restore_plan.py -v
